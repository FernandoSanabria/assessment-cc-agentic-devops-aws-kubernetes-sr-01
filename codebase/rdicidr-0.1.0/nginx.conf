server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Written at image build time from the GIT_SHA / RUN_ID build args.
    # Exact-match so it wins over the SPA fallback in `location /`.
    location = /version {
        access_log off;
        default_type application/json;
        try_files /version.json =404;
    }
}
